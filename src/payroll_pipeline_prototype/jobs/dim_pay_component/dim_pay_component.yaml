# Job spec for the dim_pay_component ETL job. Generation-time input; never deployed.
# Fill in every value shaped like <...>. Unknown fields and leftover <...> values fail validation.
# To delete this job, delete src/<package>/jobs/dim_pay_component/ and its tests:
# tests/unit/dim_pay_component/, tests/integration/test_dim_pay_component_integration.py,
# tests/end_to_end/test_dim_pay_component_e2e.py and tests/fixtures/dim_pay_component/.
job:
  name: dim_pay_component
  description: Dimensions containing attributes related to the company's wage-type catalog.
  glue:
    worker_type: G.1X
    number_of_workers: 5
  processing:
    type: backfill        # lookback | backfill; applies to every source's dates
    # schedule: cron(0 6 * * ? *)   # optional; AWS cron, UTC; only for a job with no upstream job
  sources:
    # contract: <contract name, e.g. raw_orders for contracts/raw_orders_data_contract.yaml>
    - job: pay_component_reference   # instead of contract, to read another job's output; create that job first
      alias: pay_component_reference
      allow_empty: false  # true lets this source read no rows without failing the run
      # The dates this source reads, if it is partitioned by date; an unpartitioned source sets none.
      # lookback_days: 1    # lookback only, 1 when not set: complete days ending yesterday; 0 processes the current date only
      start_date: 2024-07-31   # YYYY-MM-DD; set both dates when type is backfill, neither for lookback
      end_date: 2026-06-30     # backfill processes every day from start_date to end_date
  sink:
    contract: dim_pay_component   # the output contract: contracts/dim_pay_component_data_contract.yaml
    write_mode: overwrite     # the only mode: replaces the partitions present in the output
    partition_key: valid_from
  transformations:
    - name: create pay_component_key
      description: >
        create an md5 hashed column called pay_component_key, which hashes the lohnart_code and valid_from columns.
      # inputs: the DataFrames this transformation takes, in order; each becomes a parameter.
      # An input is a source alias, or the name of another transformation to take its output.
      # Names are written as `name:` is: lower case, spaces and hyphens become underscores.
      inputs: [pay_component_reference]
      # depends_on: every transformation named in inputs. transform() calls each of them before
      # this one, so their output exists when this one is called. Leave out source aliases:
      # read() loads every source before any transformation is called.
      # depends_on: [<transformation name>]
      # output: the result has its inputs' columns, minus removes_columns, plus columns; the
      # description is not read for this. To rename a column, list its old name under
      # removes_columns and its new name, with its type, under columns.
      output:
        grain_change: false
        columns:            # columns this transformation adds; delete the block if none
          - name: pay_component_key
            type: string
        # removes_columns: [<column this transformation drops>]
    - name: add ceiling capped flag
      description: Create a boolean flag that is true when ceiling_monthly_eur is not null.
      inputs: [create pay_component_key]
      depends_on: [create pay_component_key]
      output:
        grain_change: false
        columns:
          - name: is_ceiling_capped
            type: boolean
