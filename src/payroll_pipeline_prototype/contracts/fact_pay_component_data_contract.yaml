# Output contract of the fact_pay_component ETL job: the dataset it writes. Generation-time input;
# never deployed. Fill in every value shaped like <...>.
contract:
  layer: processed
  dataset: fact_pay_component
  description: Fact table that provides payroll information with the ability to join multiple dimension tables.
  table: hive               # a Hive table over this dataset; needs sink.partition_key and
                            # snake_case dataset and column names
  grain:
    unique_key: [employee_id, pay_run_key, lohnart_code]    # checked for duplicates on every write
  schema:
    - name: pay_period
      type: string
      nullable: false
      description: "Pay period this line applies to (e.g. year-month)."
    - name: employee_id
      type: string
      nullable: false
      description: "Foreign key to employee_master.employee_id."
    - name: cost_center_code
      type: string
      nullable: false
      description: "Cost center as booked for this specific pay period — not the employee's current cost center. Foreign key to cost_center_reference.cost_center_code."
    - name: location_code
      type: string
      nullable: false
      description: "Foreign key to location_reference.location_code — location as of this pay period."
    - name: lohnart_code
      type: string
      nullable: false
      description: "Foreign key to pay_component_reference.lohnart_code — wage type code."
    - name: gl_account
      type: string
      nullable: false
      description: "General ledger account this line posts to."
    - name: quantity
      type: decimal(12,4)
      nullable: true
      description: "Quantity basis for the component (e.g. hours), where applicable. Null for flat-amount components."
    - name: rate
      type: decimal(12,6)
      nullable: true
      description: "Rate applied to quantity to derive amount_eur, where applicable. Null for flat-amount components."
    - name: assessment_base_eur
      type: decimal(14,2)
      nullable: true
      description: "Base amount this component's contribution/tax was calculated against. Null where not applicable to the component type."
    - name: amount_eur
      type: decimal(14,2)
      nullable: false
      description: "Regular-run amount plus any retro-pay correction booked to the same employee/pay_period/lohnart_code."
    - name: period_end_date
      type: date
      nullable: false
      description: "The last day of the calendar month in the given pay period."
    - name: date_key
      type: int
      nullable: false
      description: "Integer in yyyymmdd format, corresponding to the value of the period_end_date column. Used as the foreign key for the dim_date data source."
    - name: pay_run_key
      type: string
      nullable: false
      description: "MD5 hash of the pay_run_id column."
    - name: employee_key
      type: string
      nullable: true
      description: "Hashed ID of the concatenation of the employee_id and valid_from fields."
    - name: cost_center_key
      type: string
      nullable: false
      description: "MD5 hash of the cost_center_code and valid_from dimensions."
    - name: location_key
      type: string
      nullable: false
      description: "MD5 hash of the location_code and valid_from dimensions."
    - name: pay_component_key
      type: string
      nullable: false
      description: "MD5 hash of the lohnart_code and valid_from dimensions."
