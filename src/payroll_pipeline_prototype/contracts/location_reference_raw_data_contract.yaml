# Source contract location_reference_raw: data no job in this project writes. Written by
# `scaffold create-source-contracts` for location_reference. Describe the files exactly as they are on
# disk. Generation-time input; never deployed.
contract:
  layer: raw                  # raw | preprocessed | processed
  dataset: location_reference
  file_format: json
  partition_key: snapshot_date
  schema:
    - name: snapshot_date
      type: date
      nullable: false
      description: "The date in which the snapshot of the location reference is generated."
    - name: location_code
      type: string
      nullable: false
      description: "Natural key for the location"
    - name: location_name
      type: string
      nullable: false
      description: "Location site name"
    - name: site_type
      type: string
      nullable: false
      description: "Type of site (e.g. HQ, fulfillment center)."
    - name: street_address
      type: string
      nullable: false
      description: "Site street address"
    - name: postal_code
      type: string
      nullable: false
      description: "Site postal code"
    - name: city
      type: string
      nullable: false
      description: "Site city."
    - name: bundesland
      type: string
      nullable: false
      description: "German federal state (e.g. Berlin, Sachsen)."
    - name: bundesland_code
      type: string
      nullable: false
      description: "Two-letter code for the federal state."
    - name: country
      type: string
      nullable: false
      description: "Site country."
    - name: country_code
      type: string
      nullable: false
      description: "ISO country code."
    - name: timezone
      type: string
      nullable: false
      description: "Site timezone."
    - name: opened_date
      type: date
      nullable: false
      description: "Date the site began operations."
    - name: church_tax_rate_pct
      type: decimal(5,2)
      nullable: false
      description: "Church tax rate applicable in this state (varies by Bundesland, typically 8-9%)."
    - name: pv_regional_variant
      type: string
      nullable: false
      description: "Regional long-term care insurance (PV) contribution split variant — Saxony differs from the rest of Germany."
    - name: rv_av_ceiling_region_pre_2025
      type: string
      nullable: false
      description: "Pre-2025 East/West German contribution ceiling region flag, retained for historical reference following ceiling unification."
    - name: is_active
      type: boolean
      nullable: false
      description: "Whether the site is currently active/operational."
    - name: valid_from
      type: date
      nullable: false
      description: "Start of this record's validity period."
    - name: valid_to
      type: date
      nullable: false
      description: "End of this record's validity period. Null indicates the record is currently active."
